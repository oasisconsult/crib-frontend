name: sprint_j_inspector_onboarding
description: >
  Sprint J — Inspector Onboarding.

  Full end-to-end lifecycle for external inspector onboarding:
  create inspector contractor → create inspection → assign inspector →
  inspector retrieves portal → inspector submits checklist →
  verify state auto-advanced to completed → manager approves.

  Validates:
  - Contractor with is_inspector=true can be created.
  - Assign-inspector endpoint generates inspector_token and links contractor.
  - The public inspector portal endpoint returns the inspection without auth.
  - Inspector can submit checklist, overall condition and summary via token.
  - Submission auto-advances inspection from scheduled → in_progress → completed.
  - Manager can subsequently approve the completed inspection.

  Endpoints under test:
    POST   /api/v1/contractors                              → 201 ContractorOut
    POST   /api/v1/inspections                              → 201 InspectionOut
    POST   /api/v1/inspections/{id}/assign-inspector        → 200 InspectionOut
    GET    /api/v1/inspections/portal/{token}               → 200 InspectorPortalOut
    POST   /api/v1/inspections/portal/{token}               → 200 InspectorPortalOut
    GET    /api/v1/inspections/{id}                         → 200 InspectionOut
    POST   /api/v1/inspections/{id}/transition              → 200 InspectionOut (approve)

steps:
  # ── Setup: property ───────────────────────────────────────────────────────────

  - name: create_property
    action: create_property
    as: manager
    input:
      name: "Sprint-J Inspector Property"
      type: house
    save_as: property

  - name: assert_property_id
    action: assert_field
    input:
      target: "${property.id}"
      not_null: true

  # ── Create inspector contractor ───────────────────────────────────────────────

  - name: create_inspector
    action: create_inspector_contractor
    as: manager
    input:
      name:  "Emmanuel Okwir (Inspector)"
      email: "e.okwir.inspector@workflow.example.com"
      phone: "+256701000111"
    save_as: inspector

  - name: assert_inspector_id
    action: assert_field
    input:
      target: "${inspector.id}"
      not_null: true

  - name: assert_inspector_flag
    action: assert_field
    input:
      target: "${inspector.isInspector}"
      equals: true

  - name: assert_inspector_name
    action: assert_field
    input:
      target: "${inspector.name}"
      equals: "Emmanuel Okwir (Inspector)"

  # ── Create inspection ─────────────────────────────────────────────────────────

  - name: create_inspection
    action: create_inspection
    as: manager
    input:
      propertyId:    "${property.id}"
      type:          routine
      scheduledDate: "2026-07-01"
      scheduledTimeSlot: "09:00-11:00"
      checklist:
        - id: "jt-001"
          area: "Living Room"
          description: "Check walls and ceiling for cracks or damp"
          required: true
        - id: "jt-002"
          area: "Kitchen"
          description: "Inspect sink, taps and drainage"
          required: true
        - id: "jt-003"
          area: "Bathroom"
          description: "Check toilet, shower and water pressure"
          required: true
        - id: "jt-004"
          area: "Electrical"
          description: "Test all light switches and power sockets"
          required: false
    save_as: inspection

  - name: assert_inspection_id
    action: assert_field
    input:
      target: "${inspection.id}"
      not_null: true

  - name: assert_inspection_state_scheduled
    action: assert_field
    input:
      target: "${inspection.state}"
      equals: scheduled

  - name: assert_inspection_type
    action: assert_field
    input:
      target: "${inspection.type}"
      equals: routine

  - name: assert_checklist_count
    action: assert_field
    input:
      target: "${inspection.checklist}"
      not_null: true

  # ── Assign inspector ──────────────────────────────────────────────────────────

  - name: assign_inspector
    action: assign_inspector
    as: manager
    input:
      inspectionId:  "${inspection.id}"
      contractorId:  "${inspector.id}"
      expiresInDays: 7
    save_as: assigned_inspection

  - name: assert_inspector_contractor_linked
    action: assert_field
    input:
      target: "${assigned_inspection.inspectorContractorId}"
      not_null: true

  - name: assert_inspector_name_set
    action: assert_field
    input:
      target: "${assigned_inspection.inspectorName}"
      equals: "Emmanuel Okwir (Inspector)"

  - name: assert_not_yet_submitted
    action: assert_field
    input:
      target: "${assigned_inspection.inspectorSubmittedAt}"
      equals: null

  # ── Inspector retrieves portal (no auth) ─────────────────────────────────────
  # The inspector_token is returned in the InspectionOut after assign.
  # We store it in ctx as assigned_inspection.inspectorToken.

  # The InspectionOut does NOT expose the raw token to the manager for security.
  # In the real flow the token is only sent via email; in the test we fetch it
  # directly from the DB-backed GET endpoint using a manager session to verify
  # the portal works, then hit the public endpoint with an empty auth header.

  - name: get_inspection_with_token
    action: get_inspection
    as: manager
    input:
      inspectionId: "${inspection.id}"
    save_as: inspection_with_token

  # NB: InspectionOut does NOT expose inspector_token (security boundary).
  # So we cannot drive the public portal from the YAML alone without the token.
  # We assert the key portal-visible fields via a helper that uses
  # the manager's view, and the Python test asserts the public portal
  # via a direct DB fetch of the token.
  - name: assert_state_still_scheduled
    action: assert_field
    input:
      target: "${inspection_with_token.state}"
      equals: scheduled

  - name: assert_inspector_contractor_id_persisted
    action: assert_field
    input:
      target: "${inspection_with_token.inspectorContractorId}"
      not_null: true

  # ── Manager approves after inspection is completed ────────────────────────────
  # The Python test will: fetch the inspector_token from DB, call the public
  # portal submit endpoint, then transition to approved.
  # The YAML steps here cover what can be driven without the raw token.

  - name: assert_final_inspector_name
    action: assert_field
    input:
      target: "${inspection_with_token.inspectorName}"
      equals: "Emmanuel Okwir (Inspector)"
