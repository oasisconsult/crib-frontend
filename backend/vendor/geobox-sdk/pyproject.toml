[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geobox-sdk"
version = "1.0.0"
description = "Official Python SDK for the GeoBox Smart Addressing Platform"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "GeoBox Engineering", email = "api-support@geoboxafrica.com" }]
keywords = ["geobox", "addressing", "geocoding", "delivery", "uganda"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.10.0",
    "tenacity>=8.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21", "ruff"]

[project.urls]
Homepage = "https://geoboxafrica.com"
Documentation = "https://docs.geoboxafrica.com/sdk/python"
Repository = "https://github.com/geobox/sdk-python"

[tool.hatch.build.targets.wheel]
packages = ["geobox"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
