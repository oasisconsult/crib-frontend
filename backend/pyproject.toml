[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "crib-backend"
version = "0.1.0"
description = "Crib property management platform — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",

    # Database
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",

    # Validation / settings
    "pydantic[email]==2.10.3",
    "pydantic-settings==2.7.0",

    # Auth — Logto / OIDC
    "python-jose[cryptography]==3.3.0",
    "httpx==0.28.1",

    # Redis
    "redis[hiredis]==5.2.1",

    # Object storage (S3-compatible: AWS S3, Cloudflare R2, MinIO)
    "minio==7.2.13",
    "boto3==1.35.99",

    # Encryption (Fernet symmetric — for DB-stored secrets)
    "cryptography==44.0.0",

    # PDF generation
    "weasyprint==62.3",
    "jinja2==3.1.5",

    # Task queue
    "celery[redis]==5.4.0",
    "kombu==5.4.2",

    # Notifications
    "sendgrid==6.11.0",
    "twilio==9.3.7",
    "aiosmtplib>=3.0.0",  # async SMTP for dev (MailHog) and production SMTP relay

    # Utilities
    "python-multipart==0.0.20",
    "python-dateutil==2.9.0",
    "structlog==24.4.0",
    "ulid-py==1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "factory-boy==3.3.1",
    "ruff==0.8.6",
    "mypy==1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
env_files = [".env.test"]
