# ─────────────────────────────────────────────────────────────────────────────
# Crib — Production (Shared-Infrastructure Edition)
#
# Runs ONLY Crib-specific containers.  Postgres, Redis, Logto, and Nginx Proxy
# Manager are all shared with GeoBox on the same VPS.
#
# Usage:
#   docker compose -f docker-compose.prod.shared.yml --env-file .env.production up -d
#
# Pre-flight checklist:
#   1. On the GeoBox server, add Crib to the shared network so containers can
#      reach each other:
#        docker network connect geobox-network <container>    # or use external network below
#   2. Create the Crib database on the shared Postgres instance:
#        psql -U postgres -c "CREATE DATABASE crib_prod;"
#        psql -U postgres -c "CREATE USER crib WITH PASSWORD '...'; GRANT ALL ON DATABASE crib_prod TO crib;"
#   3. Run Crib migrations once containers are up:
#        docker compose -f docker-compose.prod.shared.yml exec backend alembic upgrade head
#   4. In Logto Admin (geobox's Logto instance):
#        a. Create a new Application  → type "Traditional Web" → note App ID + Secret
#        b. Create a new API Resource → audience = https://crib.yourdomain.com/api
#        c. Create a new M2M Application for Crib backend → note M2M App ID + Secret
#        d. Add org roles: owner, manager, landlord, tenant, maintenance
#   5. In Nginx Proxy Manager:
#        Add proxy hosts for crib.yourdomain.com → frontend:3000
#        Add proxy host for crib-api.yourdomain.com → backend:8000 (optional, BFF handles most traffic)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ─── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
      [
        "sh", "-c",
        "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2",
      ]
    env_file:
      - .env.production
    environment:
      # ── Database — assembled from individual vars, never hardcoded ────────
      DATABASE_URL: "postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}"

      # ── Redis — Crib uses DB 6 (GeoBox occupies 0-5 and 7) ───────────────
      REDIS_URL: "redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/${REDIS_DB}"

      # ── Logto — shared instance, Crib-specific app credentials ──────────
      # LOGTO_ENDPOINT must be the PUBLIC URL (browser-accessible) because
      # it is used as the OIDC issuer in JWT validation.
      LOGTO_ENDPOINT: "${LOGTO_ENDPOINT}"
      LOGTO_JWKS_URI_OVERRIDE: "${LOGTO_JWKS_URI_OVERRIDE}"   # internal Docker hostname for JWKS fetch
      LOGTO_ADMIN_ENDPOINT: "${LOGTO_ADMIN_ENDPOINT}"
      LOGTO_APP_ID: "${LOGTO_APP_ID}"
      LOGTO_APP_SECRET: "${LOGTO_APP_SECRET}"
      LOGTO_M2M_APP_ID: "${LOGTO_M2M_APP_ID}"
      LOGTO_M2M_APP_SECRET: "${LOGTO_M2M_APP_SECRET}"
      LOGTO_API_RESOURCE: "${LOGTO_API_RESOURCE}"

      # ── MinIO / S3 object storage ────────────────────────────────────────
      MINIO_ENDPOINT: "${MINIO_ENDPOINT}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY}"
      MINIO_BUCKET: "${MINIO_BUCKET:-crib-prod}"
      MINIO_SECURE: "${MINIO_SECURE:-true}"

      # ── App ──────────────────────────────────────────────────────────────
      SECRET_KEY: "${SECRET_KEY}"
      FRONTEND_URL: "${FRONTEND_URL}"
      CORS_ORIGINS: "${CORS_ORIGINS}"
      ENVIRONMENT: production
    restart: unless-stopped
    networks:
      - crib-prod
      - geobox-network    # attach to GeoBox network to reach shared services
    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket; s=socket.socket(); s.settimeout(5); s.connect(('localhost',8000)); s.close()"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 30s

  # ─── Celery Worker ──────────────────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
      [
        "celery", "-A", "app.worker.celery_app", "worker",
        "--loglevel=info",
        "-Q", "default,notifications,payments",
        "--pool=solo",
        # solo pool: single-threaded, async-friendly.
        # Crib tasks are I/O-bound (email, payments, notifications) so solo
        # handles them well while using ~70MB less RAM than prefork on this VPS.
      ]
    env_file:
      - .env.production
    environment:
      DATABASE_URL: "postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/${REDIS_DB}"
      LOGTO_ENDPOINT: "${LOGTO_ENDPOINT}"
      LOGTO_ADMIN_ENDPOINT: "${LOGTO_ADMIN_ENDPOINT}"
      LOGTO_M2M_APP_ID: "${LOGTO_M2M_APP_ID}"
      LOGTO_M2M_APP_SECRET: "${LOGTO_M2M_APP_SECRET}"
      MINIO_ENDPOINT: "${MINIO_ENDPOINT}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY}"
      SECRET_KEY: "${SECRET_KEY}"
      ENVIRONMENT: production
    restart: unless-stopped
    networks:
      - crib-prod
      - geobox-network
    depends_on:
      backend:
        condition: service_healthy

  # ─── Next.js Frontend ───────────────────────────────────────────────────────
  frontend:
    container_name: crib-frontend-prod   # explicit name — use this in NPM: crib-frontend-prod:3000
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      # NEXT_PUBLIC_* vars are baked into the bundle at build time by Next.js.
      # They must be passed as build args — runtime env vars arrive too late.
      # Build args — NEXT_PUBLIC_* vars baked into the JS bundle at build time.
      # Use LOGTO_PUBLIC_ENDPOINT (the browser-reachable public URL) here,
      # NOT LOGTO_ENDPOINT which is the internal Docker hostname for server-side.
      args:
        NEXT_PUBLIC_LOGTO_ENDPOINT: "${LOGTO_PUBLIC_ENDPOINT}"
        NEXT_PUBLIC_LOGTO_APP_ID: "${LOGTO_APP_ID}"
        NEXT_PUBLIC_LOGTO_API_RESOURCE: "${LOGTO_API_RESOURCE}"
        NEXT_PUBLIC_APP_URL: "${FRONTEND_URL}"
        NEXT_PUBLIC_MOCK_API: "false"
        NEXT_PUBLIC_MAILHOG_URL: ""
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      # Browser-facing vars (also set at runtime for SSR that reads process.env)
      NEXT_PUBLIC_LOGTO_ENDPOINT: "${LOGTO_PUBLIC_ENDPOINT}"
      NEXT_PUBLIC_LOGTO_APP_ID: "${LOGTO_APP_ID}"
      NEXT_PUBLIC_LOGTO_API_RESOURCE: "${LOGTO_API_RESOURCE}"
      NEXT_PUBLIC_APP_URL: "${FRONTEND_URL}"
      # Server-side only — internal Docker hostname avoids hairpin NAT
      # Token exchange: Next.js server → geobox-logto-prod:3001 (direct, no public internet)
      LOGTO_ENDPOINT: "${LOGTO_ENDPOINT}"
      LOGTO_ADMIN_ENDPOINT: "${LOGTO_ADMIN_ENDPOINT}"
      LOGTO_APP_SECRET: "${LOGTO_APP_SECRET}"
      LOGTO_JWKS_URI_OVERRIDE: "${LOGTO_JWKS_URI_OVERRIDE}"
      # Backend BFF target — internal network
      BACKEND_URL: "http://backend:8000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - crib-prod       # reaches backend via internal network
      - npm-network     # NPM proxies crib.geoboxafrica.com → this container
      - geobox-network  # server-side token exchange reaches geobox-logto-prod directly

# ─────────────────────────────────────────────────────────────────────────────
# Networks
# crib-prod    — internal network for Crib containers only
# geobox-network — external (GeoBox stack); backend/worker reach shared services
# npm-network    — external (NPM stack); frontend is reachable by NPM so it can
#                  proxy crib.geoboxafrica.com → frontend:3000
# ─────────────────────────────────────────────────────────────────────────────
networks:
  crib-prod:
    driver: bridge

  geobox-network:
    external: true
    name: geobox-network

  npm-network:
    external: true
    name: nginx-proxy-manager_nginx-proxy-manager_default
