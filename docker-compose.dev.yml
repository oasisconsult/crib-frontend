version: "3.9"
# ─── Shared development / CI environment ──────────────────────────────────────
# Usage: docker compose -f docker-compose.dev.yml --env-file .env.development up

services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - crib-dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    env_file:
      - .env.development
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - crib-dev

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.development
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      MINIO_ENDPOINT: "minio:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - crib-dev

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env.development
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - crib-dev

  redis:
    image: redis:7-alpine
    env_file:
      - .env.development
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - crib-dev

  logto:
    image: svhd/logto:latest
    env_file:
      - .env.development
    environment:
      DB_URL: "postgresql://${LOGTO_POSTGRES_USER}:${LOGTO_POSTGRES_PASSWORD}@logto-postgres:5432/${LOGTO_POSTGRES_DB}"
      ENDPOINT: "${NEXT_PUBLIC_LOGTO_ENDPOINT}"
      ADMIN_ENDPOINT: "${LOGTO_ADMIN_ENDPOINT}"
    depends_on:
      logto-postgres:
        condition: service_healthy
    entrypoint: ["sh", "-c", "npx @logto/cli db seed -- --db-url $$DB_URL || true && npm start"]
    restart: unless-stopped
    networks:
      - crib-dev

  logto-postgres:
    image: postgres:16-alpine
    env_file:
      - .env.development
    environment:
      POSTGRES_USER: "${LOGTO_POSTGRES_USER}"
      POSTGRES_PASSWORD: "${LOGTO_POSTGRES_PASSWORD}"
      POSTGRES_DB: "${LOGTO_POSTGRES_DB}"
    volumes:
      - logto_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$LOGTO_POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - crib-dev

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "-Q", "default,notifications,payments"]
    env_file:
      - .env.development
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      MINIO_ENDPOINT: "minio:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - crib-dev

  minio:
    image: minio/minio:latest
    env_file:
      - .env.development
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY}"
    volumes:
      - minio_dev_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - crib-dev

volumes:
  postgres_dev_data:
  logto_dev_data:
  minio_dev_data:

networks:
  crib-dev:
    driver: bridge
