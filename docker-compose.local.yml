# version: "3.9"
# ─── Local development (single developer machine) ─────────────────────────────
# Usage: docker compose -f docker-compose.local.yml --env-file .env.local up
#   OR:  make dev   (Makefile passes --env-file automatically)

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "3010:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_LOGTO_ENDPOINT: "http://localhost:3001"
      # Server-side endpoint for token exchange — uses Docker network, not localhost
      LOGTO_ENDPOINT: "http://logto:3001"
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_APP_URL: "http://localhost:3010"
      BACKEND_URL: "http://backend:8000"
      # Disable mock mode in Docker so the backend proxy rewrite is active and
      # AuthInitializer fetches a real Bearer token from /api/auth/token.
      # To use MSW mock data instead, comment this line out (or set to "true").
      NEXT_PUBLIC_MOCK_API: "false"
    # depends_on:
    #   - backend
    networks:
      - crib-local

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env.local
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      MINIO_ENDPOINT: "minio:9000"
      # logto_endpoint must be the PUBLIC URL so logto_issuer matches
      # the `iss` claim in Logto JWTs (Logto sets iss = ENDPOINT/oidc).
      LOGTO_ENDPOINT: "http://localhost:3001/"
      # JWKS are fetched server-to-server so use the Docker-internal hostname.
      LOGTO_JWKS_URI_OVERRIDE: "http://logto:3001/oidc/jwks"
      LOGTO_ADMIN_ENDPOINT: "http://logto:3002/"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crib-local

  postgres:
    image: postgres:16-alpine
    # ports:
    #   - "5433:5432"
    env_file:
      - .env.local
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - crib-local

  redis:
    image: redis:7-alpine
    # ports:
    #   - "6380:6379"
    env_file:
      - .env.local
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - crib-local

  logto:
    image: svhd/logto:latest
    ports:
      - "3001:3001"
      - "3002:3002"
    env_file:
      - .env.local
    environment:
      DB_URL: "postgresql://${LOGTO_POSTGRES_USER:-logto}:${LOGTO_POSTGRES_PASSWORD}@logto-postgres:5432/${LOGTO_POSTGRES_DB:-logto}"
      # MUST be browser-accessible URLs — Logto uses these for CORS and the OIDC
      # discovery document. Never use Docker-internal hostnames here.
      ENDPOINT: "http://localhost:3001"
      ADMIN_ENDPOINT: "http://localhost:3002"
      TRUST_PROXY_HEADER: "1"
    depends_on:
      logto-postgres:
        condition: service_healthy
    entrypoint:
      [
        "sh",
        "-c",
        "npx @logto/cli db seed -- --db-url $$DB_URL || true && npm start",
      ]
    networks:
      - crib-local

  logto-postgres:
    image: postgres:16-alpine
    env_file:
      - .env.local
    environment:
      POSTGRES_USER: "${LOGTO_POSTGRES_USER}"
      POSTGRES_PASSWORD: "${LOGTO_POSTGRES_PASSWORD}"
      POSTGRES_DB: "${LOGTO_POSTGRES_DB}"
    volumes:
      - logto_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - crib-local

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command:
      [
        "celery",
        "-A",
        "app.worker.celery_app",
        "worker",
        "--loglevel=info",
        "-Q",
        "default,notifications,payments",
      ]
    volumes:
      - ./backend:/app
    env_file:
      - .env.local
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      MINIO_ENDPOINT: "minio:9000"
      LOGTO_ENDPOINT: "http://localhost:3001/"
      LOGTO_JWKS_URI_OVERRIDE: "http://logto:3001/oidc/jwks"
      LOGTO_ADMIN_ENDPOINT: "http://logto:3002/"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crib-local

  minio:
    image: minio/minio:latest
    ports:
      - "9010:9000"
      - "9011:9001"
    env_file:
      - .env.local
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-minioadmin}"
    volumes:
      - minio_local_data:/data
    command: server /data --console-address ":9001"
    networks:
      - crib-local

volumes:
  postgres_local_data:
  logto_local_data:
  minio_local_data:

networks:
  crib-local:
    driver: bridge
