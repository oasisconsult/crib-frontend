version: "3.9"
# ─── Local development (single developer machine) ─────────────────────────────
# Usage: docker compose -f docker-compose.local.yml --env-file .env.local up
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      # - /app/node_modules
      - /app/.next

    env_file:
      - .env.local
    environment:
      NODE_ENV: development
    # depends_on:
    # - backend
    networks:
      - crib-local

  # backend:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile.dev
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - ./backend:/app
  #   env_file:
  #     - .env.local
  #   environment:
  #     DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
  #     REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
  #     MINIO_ENDPOINT: "minio:9000"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - crib-local

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    env_file:
      - .env.local
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - crib-local

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    env_file:
      - .env.local
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - crib-local

  logto:
    image: svhd/logto:latest
    ports:
      - "3001:3001"
      - "3002:3002"
    env_file:
      - .env.local
    environment:
      DB_URL: "postgresql://${LOGTO_POSTGRES_USER}:${LOGTO_POSTGRES_PASSWORD}@logto-postgres:5432/${LOGTO_POSTGRES_DB}"
      ENDPOINT: "${NEXT_PUBLIC_LOGTO_ENDPOINT}"
      ADMIN_ENDPOINT: "${LOGTO_ADMIN_ENDPOINT}"
      TRUST_PROXY_HEADER: "1"
    depends_on:
      logto-postgres:
        condition: service_healthy
    entrypoint:
      [
        "sh",
        "-c",
        "npx @logto/cli db seed -- --db-url $$DB_URL || true && npm start",
      ]
    networks:
      - crib-local

  logto-postgres:
    image: postgres:16-alpine
    env_file:
      - .env.local
    environment:
      POSTGRES_USER: "${LOGTO_POSTGRES_USER}"
      POSTGRES_PASSWORD: "${LOGTO_POSTGRES_PASSWORD}"
      POSTGRES_DB: "${LOGTO_POSTGRES_DB}"
    volumes:
      - logto_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$LOGTO_POSTGRES_USER"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - crib-local

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env.local
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY}"
    volumes:
      - minio_local_data:/data
    command: server /data --console-address ":9001"
    networks:
      - crib-local

volumes:
  postgres_local_data:
  logto_local_data:
  minio_local_data:

networks:
  crib-local:
    driver: bridge
