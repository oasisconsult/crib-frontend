name: Deploy Crib to Staging

on:
  # Deploy only after CI passes on main — prevents broken builds reaching staging
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Keep manual trigger for hotfix deploys that bypass the CI gate
  workflow_dispatch:

jobs:
  deploy:
    # Skip if triggered by a failed CI run
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted   # self-hosted runner on the staging VPS — no SSH needed
    environment: staging

    steps:
      - name: Pull latest code
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          sudo chown -R "$(whoami):$(whoami)" /srv/apps/crib 2>/dev/null || true
          REPO_URL="https://x-access-token:${GH_PAT}@github.com/oasisconsult/crib.git"
          if [ ! -d /srv/apps/crib/.git ]; then
            echo "First deploy — cloning repo..."
            git clone -b main "$REPO_URL" /srv/apps/crib
          else
            cd /srv/apps/crib
            git fetch "$REPO_URL" main
            git reset --hard FETCH_HEAD
          fi

      - name: Sync geobox-rbac vendor
        run: |
          cd /srv/apps/crib
          make clone-deps

      - name: Build and deploy backend + worker
        run: |
          cd /srv/apps/crib
          docker compose -f docker-compose.staging.yml --env-file .env.staging \
            up -d --build --no-deps backend worker

      - name: Build and deploy frontend
        run: |
          cd /srv/apps/crib
          docker compose -f docker-compose.staging.yml --env-file .env.staging \
            up -d --build --no-deps frontend

      - name: Health check
        continue-on-error: true
        run: |
          sleep 30
          curl -sf https://crib.staging.geoboxafrica.com/api/health \
            && echo "Health check passed" \
            || echo "::warning::Frontend not yet responding — verify manually"
          curl -sf https://api-crib.staging.geoboxafrica.com/v1/health \
            && echo "API health check passed" \
            || echo "::warning::API not yet responding — verify manually"

      - name: Notify on failure
        if: failure()
        run: echo "::error::Crib staging deployment failed — check the logs above"
