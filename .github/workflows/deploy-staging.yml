name: Deploy Crib to Staging

on:
  # Deploy only after CI passes on main — prevents broken builds reaching staging
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Keep manual trigger for hotfix deploys that bypass the CI gate
  workflow_dispatch:

# Self-hosted runner runs directly on the staging VPS — no inbound SSH from GitHub.
# Git uses a read-only SSH deploy key pre-configured on the runner (no GH_PAT).
#
# One-time runner setup (run on the staging VPS):
#   ssh-keygen -t ed25519 -C "crib-staging-deploy" -f /home/runner/.ssh/crib_deploy
#   # Add public key to GitHub: Settings → Deploy Keys (read-only)
#   git -C /srv/apps/crib remote set-url origin git@github.com:oasisconsult/crib.git
#   # Add to /home/runner/.ssh/config:
#   #   Host github.com
#   #     IdentityFile /home/runner/.ssh/crib_deploy
#   #     StrictHostKeyChecking accept-new
jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    environment: staging

    steps:
      - name: Pull latest code
        run: |
          cd /srv/apps/crib
          git fetch origin main
          git reset --hard origin/main

      - name: Sync geobox-rbac vendor
        run: |
          cd /srv/apps/crib
          make clone-deps

      - name: Build and deploy backend + worker
        run: |
          cd /srv/apps/crib
          docker compose -f docker-compose.staging.yml --env-file .env.staging \
            up -d --build --no-deps backend worker

      - name: Build and deploy frontend
        run: |
          cd /srv/apps/crib
          docker compose -f docker-compose.staging.yml --env-file .env.staging \
            up -d --build --no-deps frontend

      - name: Health check
        continue-on-error: true
        run: |
          sleep 30
          curl -sf https://crib.staging.geoboxafrica.com/api/health \
            && echo "Frontend health check passed" \
            || echo "::warning::Frontend not yet responding — verify manually"
          curl -sf https://api-crib.staging.geoboxafrica.com/v1/health \
            && echo "API health check passed" \
            || echo "::warning::API not yet responding — verify manually"

      - name: Notify on failure
        if: failure()
        run: echo "::error::Crib staging deployment failed — check the logs above"
