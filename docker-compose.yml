version: "3.9"
# ─── Production environment ────────────────────────────────────────────────────
# Usage: docker compose --env-file .env.production up -d

services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - crib-prod

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    depends_on:
      - backend
      - logto
    restart: unless-stopped
    networks:
      - crib-prod

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.production
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      MINIO_ENDPOINT: "minio:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - crib-prod
    deploy:
      replicas: 2

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env.production
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - crib-prod

  redis:
    image: redis:7-alpine
    env_file:
      - .env.production
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - crib-prod

  logto:
    image: svhd/logto:latest
    env_file:
      - .env.production
    environment:
      DB_URL: "postgresql://${LOGTO_POSTGRES_USER}:${LOGTO_POSTGRES_PASSWORD}@logto-postgres:5432/${LOGTO_POSTGRES_DB}"
      ENDPOINT: "${NEXT_PUBLIC_LOGTO_ENDPOINT}"
      ADMIN_ENDPOINT: "${LOGTO_ADMIN_ENDPOINT}"
    depends_on:
      logto-postgres:
        condition: service_healthy
    entrypoint: ["sh", "-c", "npx @logto/cli db seed -- --db-url $$DB_URL || true && npm start"]
    restart: unless-stopped
    networks:
      - crib-prod

  logto-postgres:
    image: postgres:16-alpine
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: "${LOGTO_POSTGRES_USER}"
      POSTGRES_PASSWORD: "${LOGTO_POSTGRES_PASSWORD}"
      POSTGRES_DB: "${LOGTO_POSTGRES_DB}"
    volumes:
      - logto_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$LOGTO_POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - crib-prod

  minio:
    image: minio/minio:latest
    env_file:
      - .env.production
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY}"
    volumes:
      - minio_prod_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - crib-prod

volumes:
  postgres_prod_data:
  redis_prod_data:
  logto_prod_data:
  minio_prod_data:

networks:
  crib-prod:
    driver: bridge
